# Codex settings both machines share. `twin dotfiles apply` renders each
# machine's ~/.codex/config.toml from this file, that machine's fragment
# beside it (mac.toml, mini.toml), and the tables Codex and its desktop app
# write for themselves, which are kept from the local file
# (codex_runtime_tables in ../twin.toml). ~/.codex/config.toml is never a
# link: an edit made there is reported as drift, and belongs here.

disable_response_storage = true
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "low"
sandbox_mode = "danger-full-access"
approval_policy = "never"
service_tier = "fast"

[shell_environment_policy]
inherit = "all"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 40

[tools]
view_image_tool = true

[features]
collaboration_modes = true
goals = true
js_repl = false

[notice]
hide_gpt5_1_migration_prompt = true
suppress_unstable_features_warning = true
hide_rate_limit_model_nudge = true

[tui]
# Tokyo Night Moon syntax palette, matching the terminal theme.
# Loaded from ~/.codex/themes/tokyo-night-moon.tmTheme.
theme = "tokyo-night-moon"
vim_mode_default = true
# Two visual layers: the footer identifies the Git work, context usage, and
# committed branch diff; the pane border adds a convention-aware path and
# carries session/runtime health. Codex owns the changing runtime values, so
# no rollout-log parsing is involved.
status_line = [
  "git-branch",
  "pull-request-number",
  "context-used",
  "branch-changes",
]
terminal_title = [
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "model-with-reasoning",
]
pet = "disabled"
screen_reader_detection_done = true

[tui.keymap.chat]
# Option+Up opens questions or edits queued messages; Option+Down returns.
edit_queued_message = "alt-up"
prompt_stack_back = "alt-down"

# BEGIN skill-sync generated exclusions
# Generated from skill-policy.yaml; run skill-sync after imports or updates.
[[skills.config]]
path = "~/.codex/skills/.system/plugin-creator/SKILL.md"
enabled = false

[[skills.config]]
path = "~/.codex/skills/.system/skill-creator/SKILL.md"
enabled = false

[[skills.config]]
path = "~/.codex/skills/.system/skill-installer/SKILL.md"
enabled = false

# END skill-sync generated exclusions
