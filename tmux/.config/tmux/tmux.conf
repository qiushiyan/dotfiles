# -- general -------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# pass OSC 8 hyperlinks (gh, eza, ls --hyperlink, ...) through to ghostty
# sync must be declared, not detected: Ghostty supports synchronized output
# (DEC 2026) but ships its terminfo inside the app bundle, so the system
# database has no xterm-ghostty entry for tmux to read the Sync capability
# from. Without it, redraws under a popup aren't atomic and the popup
# flickers (or shows half-drawn) whenever the pane beneath is streaming.
set -as terminal-features ",xterm-ghostty:hyperlinks,sync"
# GOTCHA: if the server is auto-started from a non-interactive context (agent,
# launchd), its environment can carry NO_COLOR=1, which every pane inherits and
# claude/chalk/rg then render monochrome. Strip it at server start.
set-environment -gu NO_COLOR
# Same class of leak, worse consequence: a server started from inside a Claude
# Code session carries that session's CLAUDE_CONFIG_DIR, and every pane's bare
# `claude` then silently runs on that account. The managed launchers
# (headroom launch) construct their own environment, but tools outside them
# read the variable — strip it at server start.
set-environment -gu CLAUDE_CONFIG_DIR

set -g prefix2 C-a
bind C-a send-prefix -2

set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on
set -gq allow-passthrough on
set -g history-limit 100000
set -g mouse on
set-window-option -g mode-keys vi

# reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# prefix x kills the current WINDOW (with confirm — it's a whole task/worktree).
# Panes normally close by exiting their shell (C-d); prefix X force-kills a
# stuck pane (a hung process / TUI that won't take C-d).
bind-key x confirm-before -p "kill window #W? (y/n)" kill-window
bind-key X kill-pane
set -g detach-on-destroy off

# prefix d detaches — guard it behind a confirm so a mispressed prefix-d doesn't
# silently drop you out of the session. Same y/n idiom as the kill bindings.
bind-key d confirm-before -p "detach? (y/n)" detach-client

# -- display -------------------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g display-panes-time 800
set -g display-time 3000
set -g status-interval 10
set -g status-position top
set-option -g allow-rename off
set-window-option -g automatic-rename off

# popups (worktrees, move-pane, …): rounded borders, colored from the live
# palette — #{@thm_*} in styles resolves at draw time (same trick as
# message-style below), so theme switches recolor popups with no reload.
# both styles carry an explicit bg: cells left at the default background are
# translucent under Ghostty's background-opacity, so an unstyled popup is
# see-through and shimmers as the terminal recomposites behind it. @thm_mantle
# exists in every theme file.
set -g popup-border-lines rounded
set -g popup-border-style "fg=#{@thm_overlay_0},bg=#{@thm_mantle}"
set -g popup-style "fg=#{@thm_fg},bg=#{@thm_mantle}"

# -- navigation ----------------------------------------------------------------

# sessions
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind BTab switch-client -l

# kill all other sessions (with confirm)
bind Q confirm-before -p "kill all other sessions? (y/n)" "kill-session -a"

# splits (in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# prefix Space: toggle the layout between side-by-side and stacked. Replaces the
# stock next-layout (cycling all five presets is overkill when every window here
# is two panes). Heuristic generalizes to N panes: if all panes share one row
# (a single distinct pane_top) they're laid out as a row, so stack them into a
# column (even-vertical); otherwise lay them out as a row (even-horizontal).
# GOTCHA: if-shell FORMAT-EXPANDS its shell-command before sh runs it, so a bare
# #{pane_top} would be baked to the ACTIVE pane's top — the inner list-panes then
# prints that one literal for every pane, the count is always 1, and it only ever
# picks even-vertical (flips a row to a column, but a no-op on a column). So
# ##{pane_top} defers expansion to the inner tmux (real per-pane tops), while
# #{window_id} IS expanded now, on purpose, to pin the inner list-panes to this
# window so it doesn't rely on $TMUX_PANE being inherited.
bind Space if-shell 'test $(tmux list-panes -t #{window_id} -F "##{pane_top}" | sort -u | wc -l) -eq 1' \
    "select-layout even-vertical" \
    "select-layout even-horizontal"

# pane navigation (h/j/k/l)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# pane resizing
bind -r J resize-pane -D 2
bind -r H resize-pane -L 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# -- pane mode (prefix p) ------------------------------------------------------
# One key replaces the scattered pane verbs. `prefix p` enters a STICKY key
# table: every binding below re-enters it, so you nudge, look, nudge again
# without re-prefixing. It is not a trap — tmux drops a client back to the root
# table after ANY key, bound or not (verified), so one stray keypress exits.
#
# Retired here in its favour: prefix ! / @ (break/join to a magic _hidden_pane
# window — never used), prefix < / > (swap-pane -U/-D, unmemorable), the
# prefix P fzf window→position picker, and later the m/M mark-and-move pair
# (replaced by hold/put and the w picker below),
# which is native, works across sessions, and needs no popup.
#
# h/j/k/l PUSH the pane: trade places with the neighbour that way, or become
# the full-span wall if there is none. The edge guard is load-bearing, not a
# nicety — tmux's {left-of} and friends WRAP, so an unguarded swap at an edge
# grabs the pane on the OPPOSITE side (see tmux-pane-relocate.sh).
#
# u undoes the last PUSH, from a journal of (pane order, layout) pairs. It is
# deliberately NOT select-layout -o: that undoes geometry, but a swap changes
# pane identity at identical geometry, so -o cannot reverse a push. Its scope is
# deliberately narrow — m/M and b are NOT journalled, because a cross-window
# move can destroy the very window an undo record lives on, and a transactional
# cross-window history is a much bigger feature than this mode needs.
bind-key p switch-client -T panes

# Movement — push, then stay in the mode. NOT `run-shell -b`: the mode re-enters
# its table immediately, so ordinary fast repeats (l l l) launch overlapping
# scripts, and the journal's read-modify-write then loses entries — two
# concurrent pushes reliably recorded one. Plain run-shell puts these on tmux's
# command queue, which serializes them. Float keeps -b, since its popup blocks
# by design.
bind-key -T panes h run-shell "bash ~/.config/tmux/scripts/tmux-pane-relocate.sh push left  '#{pane_id}'" \; switch-client -T panes
bind-key -T panes j run-shell "bash ~/.config/tmux/scripts/tmux-pane-relocate.sh push down  '#{pane_id}'" \; switch-client -T panes
bind-key -T panes k run-shell "bash ~/.config/tmux/scripts/tmux-pane-relocate.sh push up    '#{pane_id}'" \; switch-client -T panes
bind-key -T panes l run-shell "bash ~/.config/tmux/scripts/tmux-pane-relocate.sh push right '#{pane_id}'" \; switch-client -T panes

# Resize.
bind-key -T panes H resize-pane -L 2 \; switch-client -T panes
bind-key -T panes J resize-pane -D 2 \; switch-client -T panes
bind-key -T panes K resize-pane -U 2 \; switch-client -T panes
bind-key -T panes L resize-pane -R 2 \; switch-client -T panes

# Focus (move the cursor, not the pane).
bind-key -T panes Left  select-pane -L \; switch-client -T panes
bind-key -T panes Down  select-pane -D \; switch-client -T panes
bind-key -T panes Up    select-pane -U \; switch-client -T panes
bind-key -T panes Right select-pane -R \; switch-client -T panes

# Cross-window moves: HOLD → walk → PUT. g picks the pane up and LEAVES the
# mode, because the next thing you do is navigate with the ordinary window keys
# (prefix 1-9, C-h/C-l, Tab); the spare status row shows ✋ and what is held for
# as long as it is. p (so: prefix p p) puts it in the window you are looking at
# — full-height right column — and STAYS in the mode, so hjkl place it next.
# G drops the hold; Esc never does (leaving the mode is not changing your mind).
# State is a private global option, not tmux's mark: see tmux-pane-relocate.sh.
# refresh-client -S: a key in a custom table drops the client to root BEFORE
# its command runs, so put's window switch redraws the spare row in that root
# state (empty — the hold is gone by then), and switch-client -T does not
# redraw on its own; the cheat sheet would stay blank until the next periodic
# status refresh. Same for the ✋ marker appearing/vanishing on hold/release.
bind-key -T panes g run-shell "bash ~/.config/tmux/scripts/tmux-pane-relocate.sh hold '#{pane_id}'" \; refresh-client -S
bind-key -T panes p run-shell "bash ~/.config/tmux/scripts/tmux-pane-relocate.sh put '#{pane_id}'" \; switch-client -T panes \; refresh-client -S
bind-key -T panes G run-shell "bash ~/.config/tmux/scripts/tmux-pane-relocate.sh release" \; switch-client -T panes \; refresh-client -S

# Layout verbs.
bind-key -T panes u run-shell "bash ~/.config/tmux/scripts/tmux-pane-relocate.sh undo '#{window_id}'" \; switch-client -T panes
bind-key -T panes e select-layout -E \; switch-client -T panes
bind-key -T panes Space if-shell 'test $(tmux list-panes -t #{window_id} -F "##{pane_top}" | sort -u | wc -l) -eq 1' \
    "select-layout even-vertical" "select-layout even-horizontal" \; switch-client -T panes

# The picker: w pops up this session's other windows with a preview; Enter
# moves THIS pane there and lands you beside it, back in pane mode. run-shell -b
# because display-popup blocks its issuing command, and NO re-entry here: the
# script re-enters the mode itself once the popup has closed (T11 pins that).
bind-key -T panes w run-shell -b "bash ~/.config/tmux/scripts/tmux-pane-relocate.sh pick '#{pane_id}' '#{client_name}'"

# Break out to its own window, and float. Both LEAVE the mode first: break
# changes which window you are in, and float opens a blocking container whose
# nested client must not inherit a pending table.
# break goes through the script so the source window's push journal is cleared
# (its records describe a pane set the window no longer has — see the script).
bind-key -T panes b run-shell "bash ~/.config/tmux/scripts/tmux-pane-relocate.sh break '#{pane_id}'"
bind-key -T panes z run-shell -b "bash ~/.config/tmux/scripts/tmux-float-pane.sh toggle '#{pane_id}' '#{client_name}'"

# Explicit exits. Escape/Enter/q return to root; any unbound key does too.
bind-key -T panes Escape switch-client -T root
bind-key -T panes Enter  switch-client -T root
bind-key -T panes q      switch-client -T root

# -- floating zoom (prefix z) --------------------------------------------------
# prefix z maximizes the pane into a floating overlay instead of tmux's
# all-or-nothing zoom, so the rest of the window stays visible AND live behind
# it (panes keep redrawing behind a popup — the man page says otherwise but
# CHANGES has "Do not freeze output in panes when a popup is open"). Stock zoom
# moves to prefix C-z. Mechanism and restore contract: tmux-float-pane.sh.
#
# run-shell (not display-popup directly) because run-shell EXPANDS #{pane_id},
# so the pane travels as an argument instead of through a global env var — the
# older popups here stash context in globals, which races when two clients act
# at once. -b because display-popup BLOCKS its issuing command until dismissed.
bind-key z run-shell -b "bash ~/.config/tmux/scripts/tmux-float-pane.sh toggle '#{pane_id}' '#{client_name}'"

# prefix Z: an EPHEMERAL scratch shell in a popup, at the current pane's
# directory — poke around next to a running agent without carving out a pane.
# ctrl-d / exit closes it; nothing is created and nothing needs restoring. Same
# z family as the float, one shift up: z acts on this pane, Z conjures a
# throwaway one. The popup runs a plain shell (not a nested tmux client), so it
# needs none of the float-root staging below.
bind-key Z run-shell -b "bash ~/.config/tmux/scripts/tmux-float-pane.sh scratch '#{pane_id}' '#{client_name}'"

# Stock all-or-nothing zoom, displaced from Z. It shadows suspend-client, a key
# that freezes the whole client until a shell-side `fg` — no loss.
bind-key C-z resize-pane -Z

# The float's key surface. The holder session sets `key-table float-root`
# (tmux-float-pane.sh), which REPLACES the client's default table — so tmux no
# longer intercepts the prefix at all, and only what is bound below exists.
# This is the standard nested-tmux recipe: keys unbound in a custom root table
# pass through to the pane, so typing in the floated app is unaffected, while
# this config's destructive verbs (x/X/Q kill, c/N/| create, !/@/P relocate,
# W worktrees, T/C-f session switches) are simply not reachable inside a float.
bind-key -T float-root C-b switch-client -T float-prefix
bind-key -T float-root C-a switch-client -T float-prefix

# Detaching the nested client is what closes the float: the blocking attach
# inside the container returns, and the container's shell restores the pane.
bind-key -T float-prefix z detach-client
bind-key -T float-prefix d detach-client
bind-key -T float-prefix "[" copy-mode

# window navigation
# (n only — p is pane mode, bound above. This block runs AFTER that binding, so
# an `unbind p` here would silently kill it.)
unbind n
# window switches clear the agent-done dot on the window you land on. The nav
# command runs first, so the inline `set -w @agent_done 0` (which runs in THIS
# client's context) targets the window you just moved to — the one reliable way
# to know it. recount then refreshes the ◷ badge (it's window-agnostic, so a
# background run-shell is fine). Clearing an unflagged window is a harmless no-op.
bind -r C-h previous-window \; set -w @agent_done 0 \; run-shell -b "bash ~/.config/tmux/scripts/tmux-agent-recount.sh"
bind -r C-l next-window     \; set -w @agent_done 0 \; run-shell -b "bash ~/.config/tmux/scripts/tmux-agent-recount.sh"
bind Tab last-window        \; set -w @agent_done 0 \; run-shell -b "bash ~/.config/tmux/scripts/tmux-agent-recount.sh"
bind-key N new-window -a -c "#{pane_current_path}"
bind-key m command-prompt -I "#W" "rename-window '%%'"
# M is the PANE rename, not the session one: sessions get named once (or by the
# worktree popup) and then never again, while panes are relabeled per task, so the
# key goes to the frequent verb. Nothing is lost — tmux's own default `prefix $` still
# renames the session (we never unbind -a), which is where that verb belonged anyway.
# The prompt is a popup, not the status-line command-prompt — it reads at eye level, in
# the same rounded frame as the worktree/move-pane popups. That means a script:
# command-prompt can't render in a popup, and a popup can't -I prefill, so the prefill,
# the empty-input reset and the option juggling live in tmux-rename-pane.sh — which
# drives fzf as a plain text field (--disabled, no input list), because a shell
# line-editor in there doesn't edit (see the script's header). `display-popup` does NOT
# expand #{...} in its command argument, so the pane id goes through a global env var
# set by run-shell, which does — the same stash-then-consume idiom as `prefix P` above.
# 60x5 = a 58x3 interior: prompt line, hint line, and no wasted space.
bind-key M run-shell "tmux set-environment -g RENAME_PANE_TARGET '#{pane_id}'" \; \
  display-popup -E -w 60 -h 5 -T ' rename pane ' \
  "exec ~/.config/tmux/scripts/tmux-rename-pane.sh"
# Panes have no native rename verb — only the -T flag on select-pane — so there's
# nothing to tab-complete at the `:` prompt the way `rename-window` does. Expose them
# as command aliases instead: `rename-pane "title"` and `unname-pane` complete like
# native verbs (tmux's prompt completes command-alias entries too). M's popup does the
# same work for the CURRENT pane; these stay for the cross-pane case (`rename-pane -t`
# isn't a thing — you target by running them from `:` with the pane selected) and as
# the readable spelling of what the script does. Indices 100+ stay clear of tmux's
# built-in aliases (split-window, etc.) at the low indices.
# pane-border-status is per-WINDOW (you can't border one pane alone) and has several
# interested parties — named panes AND Claude context chips (see the border block near
# the bottom) — so the verbs only ever turn it ON: naming a pane borders this window
# immediately, which is always correct (a named pane needs the row). Turning it OFF is
# owned by ONE place, tmux-claude-ctx.sh `reconcile`, which unname-pane calls: the
# border drops only when no pane in the window is named or carries a chip, so unnaming
# one of two labeled panes — or a pane beside a live Claude pane — keeps the row up.
# To reset, use `unname-pane`, NOT `rename-pane ""`: the latter still turns the border
# on, just with an empty label, because the alias runs `set pane-border-status top`
# unconditionally and can't see the arg to special-case it. (NB: the arg lands on the
# LAST command in the sequence, so select-pane -T must come last in rename-pane for
# the title to attach.)
# A label alone doesn't STICK: pane_title is also what OSC 0/2 (\e]2;...\e\\) writes,
# and Claude Code repaints its status ("✳ Add steer command…") into it every render,
# so a manual label survives seconds. allow-rename off doesn't help — that governs the
# \ek...\e\\ WINDOW rename, a different sequence; the pane-title path is allow-set-title
# (on by default). So rename-pane also turns it off for THIS pane (-p beats the window
# and global scopes) — an explicit label wins, and unname-pane -u's it back to inherit
# so an unlabeled pane shows the app's title again. select-pane -T keeps working while
# it's off: the option gates escape sequences, not tmux commands. (allow-set-title
# being off also doubles as the "manually named" marker tmux-claude-ctx.sh reads.)
set -s 'command-alias[100]' 'rename-pane=set -w pane-border-status top ; set -p allow-set-title off ; select-pane -T'
set -s 'command-alias[101]' 'unname-pane=select-pane -T "" ; set -p -u allow-set-title ; run-shell -b "bash ~/.config/tmux/scripts/tmux-claude-ctx.sh reconcile #{pane_id}"'

# window reordering
bind -n S-Left swap-window -t -1 \; select-window -t -1
bind -n S-Right swap-window -t +1 \; select-window -t +1

# clear screen
bind-key -T prefix C-k send-keys -R C-l \; clear-history

# -- copy mode -----------------------------------------------------------------

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -T copy-mode-vi C-u send -X -N 10 scroll-up
bind -T copy-mode-vi C-d send -X -N 10 scroll-down
# Esc clears the current selection but stays in copy mode (Vim visual-mode
# feel) instead of tearing down copy mode and jumping to the bottom. A quick
# double-Esc (within ~0.4s) exits copy mode, same as q. tmux has no native
# double-tap, so the first press arms @esc_armed and a background timer clears
# it; a second Esc while still armed cancels. A lone Esc thus never exits.
bind -T copy-mode-vi Escape if -F '#{@esc_armed}' {
    send -X cancel
    set -ug @esc_armed
} {
    send -X clear-selection
    set -g @esc_armed 1
    run -b 'sleep 0.4 && tmux set -ug @esc_armed'
}

# prefix y: copy "this pane's path" to the system clipboard — the absolute
# path of the file focused in Neovim when the pane is running one, else the
# pane's cwd. prefix Y is the same but copies the file path relative to nvim's
# cwd. The nvim-awareness is entirely a format conditional: nvim publishes the
# paths into the pane-scoped options @yank_path / @yank_path_rel and unsets
# them when the focused buffer isn't a copyable file (see the TmuxYankPath
# block in nvim's autocmds.lua) — option set → file, unset → cwd. tmux itself
# knows nothing about nvim.
# pbcopy rather than a tmux buffer because set-clipboard is `external` — tmux
# forwards OSC 52 from apps but never emits its own, so set-buffer -w wouldn't
# reach the clipboard.
# #{pane_current_path} is read live from the pane's *foreground* process group
# (Darwin: tcgetpgrp + PROC_PIDVNODEPATHINFO), so it's right even while nvim /
# claude / a build is running — those inherited the shell's cwd.
# The doubled ##{} is deliberate: tmux expands #{pane_id} at bind time but
# leaves the rest literal, so the inner tmux resolves the path and pipes it as
# bytes. The path itself never hits the shell's command line, where a quote or
# $ in a directory name would mangle it. The trailing display-message repeats
# the conditional so it reports what was actually copied.
bind-key y run-shell -b 'tmux display-message -p -t "#{pane_id}" "##{?##{n:@yank_path},##{@yank_path},##{pane_current_path}}" | tr -d "\n" | pbcopy' \; \
    display-message "copied #{?#{n:@yank_path},#{@yank_path},#{pane_current_path}}"
bind-key Y run-shell -b 'tmux display-message -p -t "#{pane_id}" "##{?##{n:@yank_path_rel},##{@yank_path_rel},##{pane_current_path}}" | tr -d "\n" | pbcopy' \; \
    display-message "copied #{?#{n:@yank_path_rel},#{@yank_path_rel},#{pane_current_path}}"

# prefix g: open the pane's repo on GitHub — the PR thread when the branch has
# one, else the branch's tree. Identical resolution to the `gopen` shell command,
# because the script *is* gopen with tmux supplying the cwd; a pane sitting in a
# worktree therefore opens that worktree's branch. -b because the PR lookup can
# cost a network call on a cold branch and a blocking run-shell freezes tmux —
# which is also why the client name is passed: -b discards the client context,
# and the unpushed-branch prompt needs a client to ask on.
bind-key g run-shell -b "bash ~/.config/tmux/scripts/tmux-gopen.sh open '#{pane_id}' '#{client_name}'"

# prefix b: dev-server preview via terminal-browser (pixel-accurate Chromium in
# a pane, kitty graphics). Prompt pre-filled with localhost:3000; a bare port
# works too. Routed through `new-tab`, not split-window, for its two-state
# semantics: no browser in this terminal tab -> opens one in a split to the
# right; browser already open -> the URL becomes a tab in it instead of
# stacking another split. TMUX_PANE is passed explicitly because run-shell -b
# discards the client context (same reason gopen above passes #{pane_id}) and
# the CLI otherwise errors with "could not work out which tmux pane you are in".
bind-key b command-prompt -p " open:" -I "localhost:3000" \
  { run-shell -b "TMUX_PANE='#{pane_id}' terminal-browser new-tab '%1'" }

# -- jump (flash-style; vendored fork of easyjump.tmux) ------------------------

# prefix s: flash.nvim-style jump. Type to search; every match gets a label live
# as you type. Enter -> nearest match, a label key -> that match, Escape cancels.
# C-s does the same from inside copy mode. Lands the copy-mode cursor on the
# target and starts a selection (for copy). Source + rationale live in the local
# fork at scripts/easyjump/ (see DESIGN.md) — this is NOT the TPM plugin. 's'
# shadows tmux's stock choose-tree, already covered by prefix T (sesh)/prefix C-f.
bind-key s run-shell -b "$HOME/.config/tmux/scripts/easyjump/easyjump.sh"
bind-key -T copy-mode-vi C-s run-shell -b "$HOME/.config/tmux/scripts/easyjump/easyjump.sh"

# -- sesh ----------------------------------------------------------------------

bind-key "T" run-shell "sesh connect \"$(
	sesh list | fzf-tmux -p 55%,60% \
		--no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
		--header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
		--bind 'tab:down,btab:up' \
		--bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list)' \
		--bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t)' \
		--bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c)' \
		--bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z)' \
		--bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
		--bind 'ctrl-d:execute(tmux kill-session -t {})+change-prompt(⚡  )+reload(sesh list)'
)\""

# -- worktrees -----------------------------------------------------------------

# prefix W: unified git-worktree popup (switch / create / remove / reap / PRs).
# enter=switch the highlighted worktree, or create it if the typed name matches
# nothing; ctrl-n=force-create from typed name; tab/ctrl-a=mark several;
# ctrl-x=batch-remove the marked ones (trash-and-sweep: instant mv, background
# rm, aggregated branch cleanup); ctrl-g=reap every clean worktree already
# merged into the default base; ctrl-p=check a GitHub PR out into a worktree.
# Removals loop back to the refreshed list. New worktrees go under
# ~/dev/.worktrees/<repo>/<branch>.
# "Merged" counts squash and rebase merges (not just ancestry) against a base
# refreshed in the background, and rows that qualify are tagged "· merged" in
# the list. Anything irreversible — discarding a dirty worktree, force-deleting
# an unmerged branch — is snapshotted to refs/wt-trash/<batch>/ first and the
# ref is printed.
# On create: gitignored files/dirs (default ".env* .npmrc scripts.local", any
# depth; matched dirs copied whole) are copied from the main worktree, then ONE
# command line is sent into the new window: the Node install (by lockfile)
# chained with the post-create command — default "x" (the claude alias), so a
# fresh worktree lands with the agent starting.
# Tune/disable with:
#   tmux set -g @worktree_copy_globs ".env* .npmrc scripts.local .duet docs.local"  (or "off" to disable)
#   tmux set -g @worktree_auto_install off
#   tmux set -g @worktree_post_create_cmd off   (or any command; default "x")
#   tmux set -g @worktree_show_merged off       (drop the "· merged" tag)
#   tmux set -g @worktree_backup_days 30        (0 = keep refs/wt-trash forever)
# NOTE: display-popup does NOT expand #{...} in its shell-command argument (only
# in -d), so we must NOT pass #{session_name} as an arg — it arrives literally.
# -d opens the popup in the pane's dir (so $PWD is the repo) and the script
# self-detects the session via `tmux display-message`.
bind W display-popup -E -w 80% -h 75% -d "#{pane_current_path}" -T ' worktrees ' \
	"exec ~/.config/tmux/scripts/tmux-worktree.sh"

# -- theme switcher ------------------------------------------------------------

# prefix t: the native theme menu is installed after the active palette is
# resolved below, because display-menu -C requires a literal integer and does
# not expand a #{@user_option}. See docs/theming.md.

# -- plugins -------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
# stop the navigator from binding prefix C-l as clear-screen, which would
# clobber prefix C-l = next-window above (root C-l clears instead, see below)
set -g @vim_navigator_prefix_mapping_clear_screen ""
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'wfxr/tmux-fzf-url'
# keep continuum last so its status-right hook survives other plugins
set -g @plugin 'tmux-plugins/tmux-continuum'

# fzf-url: prefix u lists URLs from scrollback, Enter opens in browser
# --tac + --layout=reverse: most-recent URL on top and pre-selected (the plugin
# captures the pane oldest->newest, so without --tac fzf selects the OLDEST).
set -g @fzf-url-history-limit '2000'
set -g @fzf-url-fzf-options '-p 60%,40% --no-sort --tac --layout=reverse --border-label " open url " --prompt "🔗  "'

# auto-save sessions every 15 min via resurrect; restore on server start
set -g @continuum-restore 'on'

# -- theme (catppuccin) -------------------------------------------------------

# Palette tracks the active terminal theme; theme-set re-sources this file on a
# switch (prefix-r works too). See docs/theming.md.
set -g @catppuccin_flavor "mocha"
# Resolve the active theme → its palette file, then force-load it. The theme
# files use `set -o` (only-if-unset), so after a switch a plain reload would
# keep every @thm_* color from the old palette — and the catppuccin plugin
# bakes @thm_* into its window/status formats at load time. The sed -ogq→-g
# strips the only-if-unset guard so the new palette actually wins. Selection +
# force-load are one run-shell so they can't race on @_theme_palette. It also
# sets the session-pill bg per theme here — tailwind uses the pale-blue
# surface_1 and vitesse its pale-sage surface_1 (their accent colors are too
# dark for the ink icon fg), others keep green — leak-free (every switch
# re-runs this) and without editing the vendored catppuccin palette; the
# prefix-active red is preserved.
#
# The @thm_window_* slots are unset before every palette load so an override
# cannot leak across a theme switch. A hand-rolled palette may then define them;
# any missing slot inherits a MATERIALIZED hex value from the palette afterward.
# Literal values are load-bearing: a nested #{E:@thm_*} stored in one of these
# options is not expanded recursively inside a #[fg=...]/#[bg=...] style and
# collapses the pill to tmux's default colours. Night Owl uses the override seam
# to make cyan mean current without recoloring @thm_mauve's other accents.
run 'theme="$(tr -d "[:space:]" < ~/.config/terminal-theme 2>/dev/null)"; \
     theme="${theme:-${TERMINAL_THEME:-flexoki_light}}"; \
     case "$theme" in \
       catppuccin_mocha) palette="$HOME/.config/tmux/plugins/tmux/themes/catppuccin_mocha_tmux.conf"; session="##{E:@thm_green}";     choice=1 ;; \
       tailwind_light)   palette="$HOME/.config/tmux/themes/tailwind_tmux.conf";              session="##{E:@thm_surface_1}"; choice=2 ;; \
       tokyo_night_moon) palette="$HOME/.config/tmux/themes/tokyo_night_moon_tmux.conf";      session="##{E:@thm_green}";     choice=3 ;; \
       gruvbox_dark)     palette="$HOME/.config/tmux/themes/gruvbox_dark_tmux.conf";          session="##{E:@thm_green}";     choice=4 ;; \
       vitesse_light_soft) palette="$HOME/.config/tmux/themes/vitesse_light_soft_tmux.conf";  session="##{E:@thm_surface_1}"; choice=5 ;; \
       night_owl)        palette="$HOME/.config/tmux/themes/night_owl_tmux.conf";             session="##{E:@thm_green}";     choice=6 ;; \
       orng_light)       palette="$HOME/.config/tmux/themes/orng_light_tmux.conf";            session="##{E:@thm_surface_1}"; choice=7 ;; \
       forest_night)     palette="$HOME/.config/tmux/themes/forest_night_tmux.conf";          session="##{E:@thm_green}";     choice=8 ;; \
       *)                palette="$HOME/.config/tmux/themes/flexoki_tmux.conf";               session="##{E:@thm_green}";     choice=0 ;; \
     esac; \
     tmux set -g @_theme_palette "$palette"; \
     tmux set -g @theme_menu_choice "$choice"; \
     tmux set -g @catppuccin_session_color "##{?client_prefix,##{E:@thm_red},$session}"; \
     for option in \
       @thm_window_number_bg @thm_window_number_fg \
       @thm_window_text_bg @thm_window_text_fg \
       @thm_window_current_number_bg @thm_window_current_number_fg \
       @thm_window_current_text_bg @thm_window_current_text_fg; do \
         tmux set -gu "$option" 2>/dev/null || true; \
     done; \
     sed "s/ -ogq / -g /" "$palette" | tmux source -; \
     inherit_window_color() { \
       tmux show -gv "$1" >/dev/null 2>&1 || \
         tmux set -g "$1" "$(tmux show -gv "$2")"; \
     }; \
     inherit_window_color @thm_window_number_bg          @thm_overlay_2; \
     inherit_window_color @thm_window_number_fg         @thm_crust; \
     inherit_window_color @thm_window_text_bg            @thm_surface_0; \
     inherit_window_color @thm_window_text_fg           @thm_fg; \
     inherit_window_color @thm_window_current_number_bg  @thm_mauve; \
     inherit_window_color @thm_window_current_number_fg @thm_crust; \
     inherit_window_color @thm_window_current_text_bg    @thm_surface_1; \
     inherit_window_color @thm_window_current_text_fg   @thm_fg'

# Install prefix t with the active zero-based row baked into -C. This runs on
# every config reload (including theme-set), so the next opening follows the new
# theme. Indirection through #{@theme_menu_choice} in the binding itself does not
# work: display-menu validates -C as an integer before format expansion.
run 'choice="$(tmux show -gv @theme_menu_choice)"; \
     tmux bind-key t display-menu -C "$choice" -T "#[align=centre] terminal theme " -x C -y C \
       "flexoki light"      f "run-shell \"$HOME/.local/bin/theme-set flexoki_light\"" \
       "catppuccin mocha"   c "run-shell \"$HOME/.local/bin/theme-set catppuccin_mocha\"" \
       "tailwind light"     t "run-shell \"$HOME/.local/bin/theme-set tailwind_light\"" \
       "tokyo night moon"   m "run-shell \"$HOME/.local/bin/theme-set tokyo_night_moon\"" \
       "gruvbox dark"       g "run-shell \"$HOME/.local/bin/theme-set gruvbox_dark\"" \
       "vitesse light soft" v "run-shell \"$HOME/.local/bin/theme-set vitesse_light_soft\"" \
       "night owl"          n "run-shell \"$HOME/.local/bin/theme-set night_owl\"" \
       "orng light"         o "run-shell \"$HOME/.local/bin/theme-set orng_light\"" \
       "forest night"       F "run-shell \"$HOME/.local/bin/theme-set forest_night\""'

# transparent status bar
set -g @catppuccin_status_background "none"

# "custom" window style = the stock "rounded" look, but with the cap glyphs
# drawn on bg=default. The stock rounded separators paint the caps on the
# theme's mantle color (via fg+reverse), which shows as dark square corners
# when the bar itself is transparent.
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_middle_separator " "
# Feed the semantic window slots into the plugin rather than binding its four
# backgrounds directly to general-purpose palette colors.
set -g @catppuccin_window_number_color "#{@thm_window_number_bg}"
set -g @catppuccin_window_text_color "#{@thm_window_text_bg}"
set -g @catppuccin_window_current_number_color "#{@thm_window_current_number_bg}"
set -g @catppuccin_window_current_text_color "#{@thm_window_current_text_bg}"
# ##{...} defers expansion to draw time so the caps always track the live
# palette. The left cap is window_active-conditional because the plugin
# applies the same left separator to current and inactive windows.
set -g @catppuccin_window_left_separator "#[fg=##{?window_active,##{@thm_window_current_number_bg},##{@thm_window_number_bg}},bg=default]#[fg=##{?window_active,##{@thm_window_current_number_fg},##{@thm_window_number_fg}},bg=##{?window_active,##{@thm_window_current_number_bg},##{@thm_window_number_bg}}]"
set -g @catppuccin_window_right_separator "#[fg=##{@thm_window_text_bg},bg=default]"
set -g @catppuccin_window_current_right_separator "#[fg=##{@thm_window_current_text_bg},bg=default]"

# agent-done: a #{@thm_yellow} dot leads the chip when @agent_done is set on the
# window (set by tmux-agent-done.sh, cleared on focus). After the dot, fg is
# reset to the window's semantic text fg, so #W keeps its normal hue instead of
# inheriting the dot's yellow. The leading style overrides the plugin's shared
# @thm_fg, allowing Night Owl to mute only inactive names.
set -g @catppuccin_window_number "#[fg=#{@thm_window_number_fg}]#I"
set -g @catppuccin_window_current_number "#[fg=#{@thm_window_current_number_fg}]#I"
set -g @catppuccin_window_text "#[fg=#{@thm_window_text_fg}] #{?@agent_done,#[fg=#{@thm_yellow}]●#[fg=#{@thm_window_text_fg}] ,}#W"
set -g @catppuccin_window_current_text "#[fg=#{@thm_window_current_text_fg}] #{?@agent_done,#[fg=#{@thm_yellow}]●#[fg=#{@thm_window_current_text_fg}] ,}#W"

set -g status-left ""
set -g @catppuccin_session_icon "❖ "
# the plugin bakes these once with `set -o` on first load, freezing whatever
# palette was active then; raw #{@thm_*} refs resolve at draw time instead
set -g @catppuccin_status_session_icon_fg "#{@thm_crust}"
set -g @catppuccin_status_session_text_fg "#{@thm_fg}"
# agent-done: "◷ N" corner badge counts windows waiting on you in this session
# (@agents_ready, maintained by the agent scripts). Hidden when zero/unset.
set -g status-right "#{?@agents_ready,#[fg=#{@thm_yellow}]◷ #{@agents_ready}#[fg=default]  ,} #{E:@catppuccin_status_session}  "
set -g status-right-length 100

# bottom padding under the bar. tmux has no real padding knob — the status line
# is N whole rows tall (the `status` count, 1–5), nothing finer. So grow it to 2
# rows and leave the spare one blank. With status-position top, status-format[0]
# is the top row (the catppuccin bar, built from status-left/window-list/status-
# right) and status-format[1] renders directly beneath it against the panes — so
# a blank [1] reads as a one-line gap below the bar. status-style is `default`
# (bg none), so the blank row is transparent, not a colored band. tmux's own
# default status-format[1] shows pane geometry ("P: ..."); we override it empty.
set -g status 2
# ...and while pane mode is active (prefix p), that spare row becomes the mode's
# cheat sheet — the fix for "I can never remember the pane keys". Costs nothing:
# the row is already there, so nothing shifts when the hint appears.
# #{client_key_table} is re-evaluated on every status redraw, so this needs no
# script and no hook; entering/leaving the table shows/hides it by itself.
# tmux 3.7 repurposes the DEFAULT second status line as a native pane list with
# mouse controls — we override status-format[1] explicitly, so that default
# never applies here. Swapping this line back to "" would opt into it.
# The row has THREE states: in pane mode it is the cheat sheet (full above 120
# columns, compact below — the full text does not fit an 80-column client);
# out of the mode with a pane held (prefix p g) it says what is held and how to
# put it down; otherwise empty. The hold marker rides along inside the mode too.
# GOTCHA: a ternary splits its branches on commas, so the hint text must contain
# NO literal comma and no multi-attribute style spec (#[fg=x,bold]) — separate
# specs instead. Commas inside a nested #{...} are brace-protected and fine —
# which is what keeps a comma in a held pane's title (@pane_hold_label) safe.
set -g status-format[1] "#{?#{==:#{client_key_table},panes},#[align=centre]#[fg=#{@thm_crust}]#[bg=#{@thm_mauve}] PANE #[default] #[fg=#{@thm_fg}]#{?#{e|>=:#{client_width},120},hjkl push · HJKL size · arrows focus · g hold#{?#{n:@pane_hold}, #[fg=#{@thm_yellow}]✋#[fg=#{@thm_fg}],} · p put · G release · w pick · u undo push · e even · b break · z float · Esc done,hjkl push · HJKL size · g hold#{?#{n:@pane_hold}, #[fg=#{@thm_yellow}]✋#[fg=#{@thm_fg}],} · p put · w pick · u undo · Esc done}#[default],#{?#{n:@pane_hold},#[align=centre]#[fg=#{@thm_crust}]#[bg=#{@thm_yellow}] ✋ HOLDING #[default] #[fg=#{@thm_fg}]#{@pane_hold_label} · prefix p p puts it here · prefix p G releases#[default],}}"

# initialize tpm (keep at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'

# Re-color the session pill per theme. The catppuccin session module bakes its
# icon bg into the module string when the plugin first loads (status_module.conf
# derives @catppuccin_status_session_icon_bg from @catppuccin_session_color —
# set per-theme in the selector above — only while it's unset, then bakes it).
# tpm won't re-run an already-loaded plugin on a config reload, so a theme switch
# would otherwise keep the stale color. Unset the derived bg and rebuild the
# module here so it picks up the current @catppuccin_session_color.
run 'tmux set -ug @catppuccin_status_session_icon_bg; \
     tmux source-file -F "$HOME/.config/tmux/plugins/tmux/status/session.conf"'

# -- responsive window tabs ----------------------------------------------------
# When the client is narrower than @window_collapse_width, INACTIVE window tabs
# collapse to just their rounded number badge; the current window keeps its full
# pill (it's one tab, not the clutter, and you always want to see where you are).
# This is pure tmux format, not a script/plugin: #{client_width} is re-evaluated
# on every status redraw (including the client-resized event), so tabs collapse
# and expand live as you resize, with nothing to run. Lives here (theme-INDEPENDENT
# layout logic) rather than in the per-theme palette files, which only set @thm_*.
# The agent-done signal survives the collapse: a waiting tab's number badge turns
# yellow (@thm_yellow) instead of the usual inactive window badge color.
#   tmux set -g @window_collapse_width 0    # 0 = never collapse (disable)
#   tmux set -g @window_collapse_width 100  # collapse sooner (on wider terminals)
# 80 = the classic "narrow terminal" boundary: a few short tabs still fit at ~100
# cols (status-right only eats ~20), so only collapse once it's genuinely cramped.
set -gq @window_collapse_width 80
# Compact pill: rounded left cap (E0B6) + crust numeral on the badge + right cap
# (E0B4). Badge bg is yellow when @agent_done, else the inactive theme color;
# its numeral uses the matching semantic fg (or crust on urgent yellow).
set -gq @_wsf_compact "#[fg=#{?@agent_done,#{@thm_yellow},#{@thm_window_number_bg}},bg=default]#[fg=#{?@agent_done,#{@thm_crust},#{@thm_window_number_fg}},bg=#{?@agent_done,#{@thm_yellow},#{@thm_window_number_bg}}] #I #[fg=#{?@agent_done,#{@thm_yellow},#{@thm_window_number_bg}},bg=default]"
# Rebake the window pills, capture the inactive one as the wide branch, then swap
# window-status-format for a width conditional. The rebake — re-sourcing the
# plugin's main conf, which tpm skips on a reload (same reason as the session-pill
# fix above) — is load-bearing: -gF baking expands one level, so refs holding a
# hex directly (@thm_fg on the name text, @thm_crust on the numeral) land as
# LITERALS of whatever theme was active at bake time, while refs holding another
# ref (@catppuccin_window_*_color) stay dynamic. Without the rebake a theme
# switch kept e.g. gruvbox's cream #ebdbb2 name text on tailwind's pale chip.
# It also makes the capture safe unconditionally: window-status-format is always
# the plugin's fresh pill at this point, never our own conditional.
# NB: run-shell format-expands its command, so the conditional's #{...} are
# written as ##{...} to survive that pass and land literal (same reason the theme
# force-load above uses ##{ }). Rebake → capture → override are one shell, so
# ordering is guaranteed.
run 'tmux source-file "$HOME/.config/tmux/plugins/tmux/catppuccin_tmux.conf"; \
     tmux set -gq @_wsf_full "$(tmux show -gv window-status-format)"; \
     tmux set -g window-status-format "##{?##{e|<:##{client_width},##{@window_collapse_width}},##{E:@_wsf_compact},##{E:@_wsf_full}}"'

# after tpm: route BOTH resurrect save paths through the float-normalising
# wrapper. A snapshot taken while a pane is floated is unrecoverable — it
# records the source window without the pane plus a `_float_*` session holding
# it, and resurrect's format carries no pane user options to relink them (nor
# would the pane ids survive a restart). Two interception points, because
# resurrect uses two:
#   - @resurrect-save-script-path, which continuum's 15-minute timer reads and
#     execs (continuum_save.sh) — set with -gq by resurrect.tmux on every load,
#     so it must be re-set HERE, after tpm, or the plugin wins.
#   - prefix C-s, which resurrect binds straight to its own save.sh, bypassing
#     that option entirely — so rebind it too.
set -g @resurrect-save-script-path "$HOME/.config/tmux/scripts/tmux-resurrect-save.sh"
bind-key C-s run-shell "bash ~/.config/tmux/scripts/tmux-resurrect-save.sh"

# after tpm: the theme hardcodes teal-on-transparent for the command prompt /
# messages, unreadable on a light terminal. Use the window-chip colors instead;
# #{@thm_*} are resolved at draw time, so they track the active flavor.
# `fill=` is required from tmux 3.7 on: messages/prompts now draw as a format
# that overlays only their own content, so a style with just bg= paints behind
# the TEXT and leaves the rest of the row showing the status bar underneath.
# The stock default became "bg=yellow,fg=black,fill=yellow" for the same reason.
set -g message-style "fg=#{@thm_fg},bg=#{@thm_surface_0},fill=#{@thm_surface_0}"
set -g message-command-style "fg=#{@thm_fg},bg=#{@thm_surface_0},fill=#{@thm_surface_0}"

# copy-mode selection + the scroll-position badge: the theme only sets a dark
# bg, leaving the terminal's (dark) fg unreadable. Gold with an ink fg reads
# well on both palettes.
set -g mode-style "fg=#{@thm_crust},bg=#{@thm_yellow},bold"

# -- pane borders: title (left) + Claude context chip (right) ------------------
# The DEFAULT is off — no borders anywhere. Two producers turn a window's border
# on: naming a pane (rename-pane, see "navigation" above), and a live Claude Code
# session publishing its context-usage % into the pane-local @claude_ctx option
# (the tail of ~/.claude/commands/statusline-command.sh does that on every
# render, alongside the model id in @claude_ctx_model and the account lane in
# @claude_ctx_account). Turning it OFF is owned by ONE place — tmux-claude-ctx.sh `reconcile`,
# called by unname-pane, Claude's SessionEnd hook, the zsh precmd sweep in
# tmux-utils.zsh (claude killed too hard to fire its hook), and the pane-exited
# hook below — which drops the row only when no pane in the window is named or
# carries a chip.
# The format: title on the left, chip flush right via #[align=right]. The left
# slot suppresses only the HOSTNAME default (#{pane_title} == #{host}, a fresh
# pane's title) — an app-written title, like Claude's ✳ status line, DOES render
# on an unnamed pane whenever the border row is up: unnamed means the app owns
# the title (naming freezes it, see the rename-pane alias). The chip hides on
# #{n:@claude_ctx} — LENGTH,
# not truthiness, because a fresh session at 0% is a value, not an absence. Its
# severity color uses e|/ INTEGER DIVISION (pct/90 ≥ 1 → red, else pct/50 ≥ 1 →
# yellow, else green): tmux's <,>,== format comparisons are STRING compares
# ("100" < "50" is true), so division is the safe threshold test.
# Left of the percentage sit four muted fields, ordered by SCOPE rather than by
# type: the account lane and its two quota numbers belong together on the left,
# the model id and the context percentage describe this session on the right,
# and the model sits between them so three numbers never run together.
#   account    the email local part, or the full email when two lanes share
#              one; every lane publishes one, the primary included — empty
#              means the statusline could not determine it, not "this is the
#              default account".
#   5h:NN      the account's 5-hour limit, straight off Claude Code's own
#              payload.
#   Fable:NN   the MODEL-SCOPED weekly, and the model it is scoped to. The
#              vendor's payload carries only the all-models weekly, which is
#              routinely far lower than the scoped one that actually stops
#              work, so this pair comes from headroom — see
#              scripts/tmux-claude-ctx.sh for the option vocabulary and
#              ~/.claude/commands/claude-quota-refresh.sh for where it is read.
#              Neither quota number wears a "%": that keeps them distinct from
#              the context percentage beside them, and out of the strftime trap
#              described below.
#   model      the model id minus its "claude-" prefix ("opus-5[1m]" — the 1M
#              tag is the raw id's, not decoration).
# Each draws only when @claude_ctx ALSO has length (the percentage alone is
# what "chip shown" means, and the && keeps a stale label from outliving the
# number it belongs to) AND the pane is wide enough to afford it.
# The shed ladder, by priority as the pane narrows: the account below 55
# columns, the model below 40, the percentage never. The quota pair goes FIRST,
# below 75 — it is the only part of the chip that is redundant across panes
# (three panes on one lane draw the same two numbers three times, while every
# other field is that pane's own). It is also the only part that can turn
# urgent, so severity buys it back: a number at 50 or more survives to 40
# columns, one at 85 or more draws at any width. Each is judged on its OWN
# value, so a Fable at 94 rides down to a sliver while a 3% five-hour drops out
# from under it. Colour uses the same e|/ trick as the percentage with one
# difference — the calm band is the labels' muted grey, not green, so colour on
# a quota number only ever means "look at this one".
# The widths are tuned to a 221-column client: a half-split (~110) and a third
# (~73) keep the full chip, a quarter (~55) drops the quota unless it is hot,
# and only slivers fall back to the number alone.
# e|>= is ARITHMETIC comparison (the
# bare <,>,== forms are string compares, see above), so pane_width is safe in
# it.
# Codex gets a different left-to-right ladder: compact path, then the native
# title's context / rate limits / model. There is deliberately no right
# alignment in that branch: when a narrow pane clips the row, the rarely
# changed model at the far right disappears first. #{@codex_path} is produced
# by the zsh wrapper with the same git-common-dir convention as Claude, so a
# linked ~/dev/.worktrees/main/feat/x pane says planlab/main rather than
# repeating its branch. The 32-cell cap is a final guard for unusual paths.
#
# Set here, AFTER tpm, on purpose: catppuccin STATICALLY bakes #{pane_title} into
# pane-border-format if you use its pane module (catppuccin/tmux#565 — every pane
# then shows the last-focused pane's title), so we own the format directly and keep
# #{pane_title} live. #{@thm_*} resolve at draw time, like the formats above.
# GOTCHA: the styling #[...] is kept OUTSIDE the #{?...} ternaries on purpose. A
# ternary splits its branches on commas, and a comma inside a style spec (e.g.
# #[fg=...,bold]) gets mis-read as a branch separator — it leaks a literal "bold]"
# onto the border. Commas inside #{...} are brace-protected, which is why the
# severity ternaries may sit INSIDE fg=: format expansion consumes them before
# the style parser ever sees the line.
# GOTCHA 2: the border format is expanded with format_expand_time, so strftime
# eats lone literal %s. The Claude chip now sits inside the Codex/non-Codex
# branch as well as its own draw/no-draw branch, so it is strftime'd three
# times; hence eight percent signs after the chip number for one rendered %.
# Expanded VALUES are never strftime'd, so a % in a pane title stays safe.
set -g pane-border-status off
set -g pane-border-format "#[fg=#{@thm_mauve},bold]#{?#{==:#{@codex_active},1}, #{=/32/…:#{@codex_path}} #[fg=#{@thm_overlay_1}]│ #[fg=#{@thm_green}]#{pane_title} ,#{?#{==:#{pane_title},#{host}},, #{pane_title} }}#[default]#{?#{==:#{@codex_active},1},,#[align=right]#[fg=#{@thm_overlay_1}]#{?#{&&:#{n:@claude_ctx},#{&&:#{n:@claude_ctx_account},#{e|>=:#{pane_width},55}}}, #{@claude_ctx_account},}#[fg=#{?#{e|/:#{@claude_ctx_5h},90},#{@thm_red},#{?#{e|/:#{@claude_ctx_5h},50},#{@thm_yellow},#{@thm_overlay_1}}}]#{?#{&&:#{n:@claude_ctx},#{&&:#{n:@claude_ctx_5h},#{||:#{e|>=:#{pane_width},75},#{||:#{&&:#{e|>=:#{pane_width},40},#{e|/:#{@claude_ctx_5h},50}},#{e|/:#{@claude_ctx_5h},85}}}}}, 5h:#{@claude_ctx_5h},}#[fg=#{?#{e|/:#{@claude_ctx_wk},90},#{@thm_red},#{?#{e|/:#{@claude_ctx_wk},50},#{@thm_yellow},#{@thm_overlay_1}}}]#{?#{&&:#{n:@claude_ctx},#{&&:#{n:@claude_ctx_wk},#{&&:#{n:@claude_ctx_wk_model},#{||:#{e|>=:#{pane_width},75},#{||:#{&&:#{e|>=:#{pane_width},40},#{e|/:#{@claude_ctx_wk},50}},#{e|/:#{@claude_ctx_wk},85}}}}}}, #{@claude_ctx_wk_model}:#{@claude_ctx_wk},}#[fg=#{@thm_overlay_1}]#{?#{&&:#{n:@claude_ctx},#{&&:#{n:@claude_ctx_model},#{e|>=:#{pane_width},40}}}, #{@claude_ctx_model},}#[fg=#{?#{e|/:#{@claude_ctx},90},#{@thm_red},#{?#{e|/:#{@claude_ctx},50},#{@thm_yellow},#{@thm_green}}}]#{?#{n:@claude_ctx}, ✳ #{@claude_ctx}%%%%%%%% ,}}#[default]"

# A closing pane may have been the only reason its window showed a border (a
# Claude chip). The hook reconciles ALL windows — same sweep the relocation
# verbs above use, since a moved pane also strands border state on both ends.
# NO #{...} context is passed on purpose: hook-time ids race pane teardown,
# and once the dying pane is gone they RE-RESOLVE to a surviving pane — a
# mis-target that can wrongly strip a border; a settled all-window sweep
# cannot (no target = the sweep path; run-shell's env has no TMUX_PANE).
# Worst case is benign — a border lingers until the next lifecycle event,
# never wrongly drops.
set-hook -g pane-exited 'run-shell -b "sleep 0.2; bash ~/.config/tmux/scripts/tmux-claude-ctx.sh reconcile"'

# Float recovery. The container's own shell restores a floated pane on every
# ordinary exit path (prefix z, prefix d, the client being killed) — but a
# SIGKILL'd container skips that, leaving the pane alive in its holder session
# and invisible. Sweeping on attach is the backstop: the next time you attach,
# anything stranded comes home. Restore is idempotent, so a sweep that races
# the container's own restore is a no-op rather than a double move.
set-hook -g client-attached 'run-shell -b "bash ~/.config/tmux/scripts/tmux-float-pane.sh sweep"'

# agent-done: the dot is cleared by the window-nav bindings (prefix C-h/C-l/Tab,
# see "navigation" above) and by the worktree popup, NOT by a hook. A
# session-window-changed hook can't do it: inside that hook tmux's "current
# window" is still the OLD window, so the clear lands on the wrong one. A
# keybinding runs the nav command first, so the clear sees the new window.

# C-l clears the screen like outside tmux whenever there's nothing to
# navigate to. Replaces vim-tmux-navigator's root C-l (hence after tpm):
# in vim -> pass through; pane to the right -> select it; else -> clear
bind -n C-l if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'" \
    "send-keys C-l" \
    "if -F '#{pane_at_right}' 'send-keys C-l' 'select-pane -R'"
