# vim:set ft=tmux:

# --> Forest Night — blue-slate dark arrangement
#
# Hand-tuned to match ghostty/themes/forest-night (ForrestKnight's "Forest Night
# — Ethereal": bg #1a2125, fg #c9d1d9, sage-green accent, teal / purple / amber
# highlights — the Omarchy theme's colors.toml). Slot meanings (via the
# catppuccin plugin + tmux.conf separators):
#   overlay_2  = inactive window number badge      surface_0 = window name chip,
#   mauve      = current window number badge                   message bg
#   crust      = numeral/icon fg on colored chips  surface_1 = current name chip
#   fg         = text on name chips                bg        = popup bg
# Same badge design as night_owl: inactive windows get a teal number badge
# (overlay_2, the theme's cyan), the active window a purple badge (mauve, the
# theme's magenta) on the selection-slate name chip (surface_1). The plugin fixes
# the contrast direction — badges are bright (dark @thm_crust numerals), chips
# are dark (light @thm_fg names). lavender (active pane border) stays synced to
# mauve; green is the session pill (set in tmux.conf's selector) and is the
# theme's sage accent #8FBC8F; yellow is the copy-mode selection and takes the
# keyword amber. Unlike night_owl nothing is improvised: the theme's own
# lighter_background / selection / dark_background / darker_background scale
# steps are distinct enough to fill surface_0 / surface_1 / mantle / crust.
# Keys mirror plugins/tmux/themes/catppuccin_mocha_tmux.conf; loaded by the
# palette force-load in tmux.conf (which seds -ogq to -g).
set -ogq @thm_bg "#1a2125"
set -ogq @thm_fg "#c9d1d9"

# Colors (Forest Night accents)
set -ogq @thm_rosewater "#c78a7a"
set -ogq @thm_flamingo "#c78a7a"
set -ogq @thm_pink "#9B59B6"
set -ogq @thm_mauve "#9B59B6"
set -ogq @thm_red "#E91E63"
set -ogq @thm_maroon "#c78a7a"
set -ogq @thm_peach "#E67E22"
set -ogq @thm_yellow "#F39C12"
set -ogq @thm_green "#8FBC8F"
set -ogq @thm_teal "#4ECDC4"
set -ogq @thm_sky "#66D9EF"
set -ogq @thm_sapphire "#4ECDC4"
set -ogq @thm_blue "#66D9EF"
set -ogq @thm_lavender "#9B59B6"

# Surfaces and overlays (colors.toml's foreground / background scale)
set -ogq @thm_subtext_1 "#a8b3bd"
set -ogq @thm_subtext_0 "#6b7280"
# overlay_2 = inactive window number badge bg: the theme's teal (a real accent
# token) so every inactive window carries color — dark @thm_crust numerals read
# on it.
set -ogq @thm_overlay_2 "#4ECDC4"
set -ogq @thm_overlay_1 "#6b7280"
set -ogq @thm_overlay_0 "#4a5568"
set -ogq @thm_surface_2 "#455460"
# surface_1 = active window name chip bg: the editor selection slate, one step
# lighter than surface_0 so the active pill separates from inactive chips while
# staying dark enough for light @thm_fg names.
set -ogq @thm_surface_1 "#3a4a55"
set -ogq @thm_surface_0 "#222a30"
set -ogq @thm_mantle "#14191c"
# crust stays near-black: numeral fg on the purple/teal/sage badges, session
# icon fg on the sage chip, and the copy-mode selection fg
set -ogq @thm_crust "#0d1113"
