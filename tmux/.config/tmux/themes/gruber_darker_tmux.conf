# vim:set ft=tmux:
# Gruber Darker — installed th0jensen/gruber-darker.zed 0.0.8.
# Yellow is reserved for the active window and session pill; inactive badges
# and names share a charcoal surface with quartz text. Active text is dark ink
# on yellow, making focus obvious across the whole pill. All are source tokens.
# bg = popup; surface_0 = message/inactive chip; surface_1 = selected surface;
# mantle/crust = source info-background/ANSI black. Mauve carries yellow accents.
set -ogq @thm_bg "#181818"
set -ogq @thm_fg "#e4e4ef"
set -ogq @thm_rosewater "#d1c7c5"
set -ogq @thm_flamingo "#ff4f58"
set -ogq @thm_pink "#9e95c7"
set -ogq @thm_mauve "#ffdd33"
set -ogq @thm_red "#f43841"
set -ogq @thm_maroon "#c73c3f"
set -ogq @thm_peach "#cc8c3c"
set -ogq @thm_yellow "#ffdd33"
set -ogq @thm_green "#73c936"
set -ogq @thm_teal "#4ec9b0"
set -ogq @thm_sky "#96a6c8"
set -ogq @thm_sapphire "#96a6c8"
set -ogq @thm_blue "#96a6c8"
set -ogq @thm_lavender "#9e95c7"
set -ogq @thm_subtext_1 "#95a99f"
set -ogq @thm_subtext_0 "#808080"
set -ogq @thm_overlay_2 "#95a99f"
set -ogq @thm_overlay_1 "#808080"
set -ogq @thm_overlay_0 "#545454"
set -ogq @thm_surface_2 "#545454"
set -ogq @thm_surface_1 "#303030"
set -ogq @thm_surface_0 "#202020"
set -ogq @thm_mantle "#0e0e0e"
set -ogq @thm_crust "#000000"
set -ogq @thm_window_number_bg "#202020"
set -ogq @thm_window_number_fg "#95a99f"
set -ogq @thm_window_text_bg "#202020"
set -ogq @thm_window_text_fg "#95a99f"
set -ogq @thm_window_current_number_bg "#ffdd33"
set -ogq @thm_window_current_number_fg "#181818"
set -ogq @thm_window_current_text_bg "#ffdd33"
set -ogq @thm_window_current_text_fg "#181818"
