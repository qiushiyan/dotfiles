# vim:set ft=tmux:

# --> Vellum, a house theme: white paper, neutral ink, one ochre accent. The
#     bg/fg/amber come from a screenshot (white, ink #1f2022, amber #cb953d
# table headers); grays are Tailwind's neutral scale; the chromatic accents are
# Tailwind's 700 steps. Same dark-chip-on-light design as orng_light: colored
# number badges (neutral-300 inactive — quiet next to the accent — amber
# current, the theme's one warm note) on neutral-100 name chips with ink text.
# Slot meanings (via the catppuccin plugin + tmux.conf separators):
#   overlay_2  = inactive window number badge      surface_0 = window name chip,
#   mauve      = current window number badge                   message bg
#   crust      = numeral/icon fg on colored chips  surface_1 = current name chip
#   fg         = text on name chips                bg        = popup bg
# the active pill is two-tone: amber number badge (mauve) + pale amber name
# chip (surface_1, amber mixed 35/65 with white); lavender (active pane border)
# is the deeper ochre so the border reads on white (the amber itself is 2.7:1).
# Keys mirror plugins/tmux/themes/catppuccin_mocha_tmux.conf; loaded by the
# palette force-load in tmux.conf (which seds -ogq to -g).
set -ogq @thm_bg "#FFFFFF"
set -ogq @thm_fg "#1F2022"

# Colors (ochre accent + Tailwind 700s)
set -ogq @thm_rosewater "#E7000B"
set -ogq @thm_flamingo "#E7000B"
set -ogq @thm_pink "#9A6A18"
set -ogq @thm_mauve "#CB953D"
set -ogq @thm_red "#C10007"
set -ogq @thm_maroon "#9F0712"
set -ogq @thm_peach "#BB4D00"
set -ogq @thm_yellow "#9A6A18"
set -ogq @thm_green "#008236"
set -ogq @thm_teal "#007595"
set -ogq @thm_sky "#0092B8"
set -ogq @thm_sapphire "#1447E6"
set -ogq @thm_blue "#155DFC"
set -ogq @thm_lavender "#9A6A18"

# Surfaces and overlays (Tailwind neutral scale, light)
set -ogq @thm_subtext_1 "#404040"
set -ogq @thm_subtext_0 "#525252"
set -ogq @thm_overlay_2 "#D4D4D4"
set -ogq @thm_overlay_1 "#737373"
set -ogq @thm_overlay_0 "#A1A1A1"
set -ogq @thm_surface_2 "#E5E5E5"
set -ogq @thm_surface_1 "#EDDABB"
set -ogq @thm_surface_0 "#F5F5F5"
set -ogq @thm_mantle "#FAFAFA"
# crust stays ink: numeral fg on the amber/pale-amber badges, session icon fg on
# the chip, and the copy-mode selection fg
set -ogq @thm_crust "#1F2022"
