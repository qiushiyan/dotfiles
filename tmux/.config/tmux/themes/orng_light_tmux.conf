# vim:set ft=tmux:

# --> orng Light, ported from the Zed "orng" extension's light variant. Same
#     dark-chip-on-light design as flexoki_tmux.conf, orng hues: colored number
# badges (warm-gray inactive — muted so it stays quiet next to the accent —
# orange current, the orng identity accent) on pale peach name chips with ink
# text. Slot meanings (via the catppuccin plugin + tmux.conf separators):
#   overlay_2  = inactive window number badge      surface_0 = window name chip,
#   mauve      = current window number badge                   message bg
#   crust      = numeral/icon fg on colored chips  surface_1 = current name chip
#   fg         = text on name chips                bg        = popup bg
# the active pill is two-tone: orange number badge (mauve) + pale peach name
# chip (surface_1, accent mixed 35/65 with paper); lavender (active pane border)
# stays synced to the accent.
# Keys mirror plugins/tmux/themes/catppuccin_mocha_tmux.conf; loaded by the
# palette force-load in tmux.conf (which seds -ogq to -g).
set -ogq @thm_bg "#FFF7F1"
set -ogq @thm_fg "#1A1A1A"

# Colors (orng accents)
set -ogq @thm_rosewater "#E05A5E"
set -ogq @thm_flamingo "#E05A5E"
set -ogq @thm_pink "#C94D24"
set -ogq @thm_mauve "#EC5B2B"
set -ogq @thm_red "#D1383D"
set -ogq @thm_maroon "#A82D31"
set -ogq @thm_peach "#EC5B2B"
set -ogq @thm_yellow "#B0851F"
set -ogq @thm_green "#317B46"
set -ogq @thm_teal "#318795"
set -ogq @thm_sky "#4BA3B0"
set -ogq @thm_sapphire "#0062D1"
set -ogq @thm_blue "#0062D1"
set -ogq @thm_lavender "#EC5B2B"

# Surfaces and overlays (orng warm neutrals, light)
set -ogq @thm_subtext_1 "#4A4A4A"
set -ogq @thm_subtext_0 "#6B6B6B"
set -ogq @thm_overlay_2 "#C9B3A3"
set -ogq @thm_overlay_1 "#8A8A8A"
set -ogq @thm_overlay_0 "#A0A0A0"
set -ogq @thm_surface_2 "#D9C6B9"
set -ogq @thm_surface_1 "#F8C0AC"
set -ogq @thm_surface_0 "#F3E6DC"
set -ogq @thm_mantle "#FAEFE7"
# crust stays ink: numeral fg on the orange/peach badges, session icon fg on the
# chip, and the copy-mode selection fg
set -ogq @thm_crust "#1A1A1A"
