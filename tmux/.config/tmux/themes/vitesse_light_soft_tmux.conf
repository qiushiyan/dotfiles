# vim:set ft=tmux:

# --> Vitesse Refined Light Soft, ported from the Zed "Vitesse Refined Light
#     Soft" theme. Same dark-chip-on-light design as flexoki_tmux.conf, Vitesse
# hues: colored number badges (comment-sage inactive — muted so it stays quiet
# next to the green — green current, the Vitesse identity accent) on warm
# light-gray name chips with ink text. Slot
# meanings (via the catppuccin plugin + tmux.conf separators):
#   overlay_2  = inactive window number badge      surface_0 = window name chip,
#   mauve      = current window number badge                   message bg
#   crust      = numeral/icon fg on colored chips  surface_1 = current name chip
#   fg         = text on name chips                bg        = popup bg
# the active pill is two-tone: green number badge (mauve) + pale sage name chip
# (surface_1, green mixed 35/65 with paper); lavender (active pane border)
# stays synced to the green.
# Keys mirror plugins/tmux/themes/catppuccin_mocha_tmux.conf; loaded by the
# palette force-load in tmux.conf (which seds -ogq to -g).
set -ogq @thm_bg "#F1F0E9"
set -ogq @thm_fg "#393A34"

# Colors (Vitesse accents)
set -ogq @thm_rosewater "#B56959"
set -ogq @thm_flamingo "#B56959"
set -ogq @thm_pink "#A13865"
set -ogq @thm_mauve "#1E754F"
set -ogq @thm_red "#AB5959"
set -ogq @thm_maroon "#8F4747"
set -ogq @thm_peach "#A65E2B"
set -ogq @thm_yellow "#998418"
set -ogq @thm_green "#1E754F"
set -ogq @thm_teal "#2E8F82"
set -ogq @thm_sky "#2993A3"
set -ogq @thm_sapphire "#296AA3"
set -ogq @thm_blue "#296AA3"
set -ogq @thm_lavender "#1E754F"

# Surfaces and overlays (Vitesse warm neutrals, light)
set -ogq @thm_subtext_1 "#52534C"
set -ogq @thm_subtext_0 "#6B6C66"
set -ogq @thm_overlay_2 "#A0ADA0"
set -ogq @thm_overlay_1 "#999999"
set -ogq @thm_overlay_0 "#AAAAAA"
set -ogq @thm_surface_2 "#B8B5A9"
set -ogq @thm_surface_1 "#A7C5B3"
set -ogq @thm_surface_0 "#E7E5DB"
set -ogq @thm_mantle "#ECEAE1"
# crust stays ink: numeral fg on the cyan/green badges, session icon fg on the
# chip, and the copy-mode selection fg
set -ogq @thm_crust "#393A34"
