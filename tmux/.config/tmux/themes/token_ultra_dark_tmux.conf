# vim:set ft=tmux:
# Token Ultra Dark — https://github.com/ThorstenRhau/token, revision 11be57ef6913
# Badges: muted blue inactive (overlay_2), peach current (mauve), bg0 numerals.
# Name chips: bg4 (surface_0), one step lighter bg5 (surface_1) when active.
# Session pill: sage green with bg0 ink. Mantle is upstream bg1.
# Copy selection: pale gold accent2 (yellow), comfortably readable with bg0 ink.
set -ogq @thm_bg "#272724"
set -ogq @thm_fg "#c5c1b8"
set -ogq @thm_rosewater "#ed9574"
set -ogq @thm_flamingo "#dd8384"
set -ogq @thm_pink "#bea5d4"
set -ogq @thm_mauve "#ed9574"
set -ogq @thm_red "#dd8384"
set -ogq @thm_maroon "#c67777"
set -ogq @thm_peach "#ed9574"
set -ogq @thm_yellow "#f7c988"
set -ogq @thm_green "#9ab58e"
set -ogq @thm_teal "#78aba4"
set -ogq @thm_sky "#88c0c0"
set -ogq @thm_sapphire "#90b2cc"
set -ogq @thm_blue "#8aa5bb"
set -ogq @thm_lavender "#ed9574"
set -ogq @thm_subtext_1 "#a7a299"
set -ogq @thm_subtext_0 "#a39d94"
set -ogq @thm_overlay_2 "#8aa5bb"
set -ogq @thm_overlay_1 "#8d8983"
# Inactive pane borders: bg4, just above the charcoal background;
# the active peach border carries focus while inactive splits recede.
set -ogq @thm_overlay_0 "#30302c"
set -ogq @thm_surface_2 "#3c3b36"
set -ogq @thm_surface_1 "#383835"
set -ogq @thm_surface_0 "#30302c"
set -ogq @thm_mantle "#1d1d1c"
set -ogq @thm_crust "#181817"

