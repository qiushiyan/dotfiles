# vim:set ft=tmux:
# Token Meridian Light — https://github.com/ThorstenRhau/token, revision 11be57ef6913
# Inactive badge: selection gray (overlay_2); current badge: blue (mauve).
# Current badge uses paper text: ink on the deep blue fails contrast.
# Name chips: bg1 (surface_0), one step lighter bg2 (surface_1) when active.
# Session pill uses surface_1 with ink; mantle is upstream bg0.
# Copy selection uses pale match, because ink on deep ochre yellow fails 4.5:1.
set -ogq @thm_bg "#fbf9f4"
set -ogq @thm_fg "#28323a"
set -ogq @thm_rosewater "#286fc0"
set -ogq @thm_flamingo "#286fc0"
set -ogq @thm_pink "#7a1f7a"
set -ogq @thm_mauve "#0048b3"
set -ogq @thm_red "#286fc0"
set -ogq @thm_maroon "#843900"
set -ogq @thm_peach "#843900"
set -ogq @thm_yellow "#843900"
set -ogq @thm_green "#005f2f"
set -ogq @thm_teal "#095b62"
set -ogq @thm_sky "#236bb5"
set -ogq @thm_sapphire "#20538a"
set -ogq @thm_blue "#0048b3"
set -ogq @thm_lavender "#0048b3"
set -ogq @thm_subtext_1 "#46535f"
set -ogq @thm_subtext_0 "#524b42"
set -ogq @thm_overlay_2 "#dedbd3"
set -ogq @thm_overlay_1 "#524b42"
set -ogq @thm_overlay_0 "#a8a49c"
set -ogq @thm_surface_2 "#e7e3dc"
set -ogq @thm_surface_1 "#f6f5f1"
set -ogq @thm_surface_0 "#ecebe7"
set -ogq @thm_mantle "#e7e3dc"
set -ogq @thm_crust "#28323a"
set -ogq @thm_window_current_number_fg "#fbf9f4"
set -ogq @thm_mode_bg "#eadab6"

