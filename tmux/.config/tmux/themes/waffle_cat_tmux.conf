# vim:set ft=tmux:
# Waffle Cat — OldJobobo/omarchy-waffle-cat-theme, colors.toml at 8ffff576d47c.
# Honey current badge + butter label form the only gold window pill, with crust
# ink for contrast. Inactive numbers and names share a quiet coffee surface and
# oat text (4.24:1), so focus reads from the whole silhouette, not just the badge.
# All colors are upstream tokens. The session pill also uses butter (selector
# uses @thm_yellow); green stays a supporting semantic color per upstream DESIGN.
# Mauve is the honey UI accent. bg = popup; surface_0 = message; surface_1 =
# selection; mantle/crust = depth. Window overrides keep these roles independent.
set -ogq @thm_bg "#292025"
set -ogq @thm_fg "#fff4d8"
set -ogq @thm_rosewater "#ddb0b8"
set -ogq @thm_flamingo "#cf7358"
set -ogq @thm_pink "#c98c97"
set -ogq @thm_mauve "#c87d2a"
set -ogq @thm_red "#cf7358"
set -ogq @thm_maroon "#e58a70"
set -ogq @thm_peach "#df9850"
set -ogq @thm_yellow "#e4c56d"
set -ogq @thm_green "#9fad68"
set -ogq @thm_teal "#9eb8b2"
set -ogq @thm_sky "#c2d5d0"
set -ogq @thm_sapphire "#9eb8b2"
set -ogq @thm_blue "#c87d2a"
set -ogq @thm_lavender "#e4c56d"
set -ogq @thm_subtext_1 "#fff4d8"
set -ogq @thm_subtext_0 "#a58c82"
set -ogq @thm_overlay_2 "#c8964b"
set -ogq @thm_overlay_1 "#a58c82"
set -ogq @thm_overlay_0 "#6b5650"
set -ogq @thm_surface_2 "#6b5650"
set -ogq @thm_surface_1 "#6b5650"
set -ogq @thm_surface_0 "#362d30"
set -ogq @thm_mantle "#1f181c"
set -ogq @thm_crust "#151013"
set -ogq @thm_window_number_bg "#362d30"
set -ogq @thm_window_number_fg "#a58c82"
set -ogq @thm_window_text_bg "#362d30"
set -ogq @thm_window_text_fg "#a58c82"
set -ogq @thm_window_current_number_bg "#c87d2a"
set -ogq @thm_window_current_number_fg "#151013"
set -ogq @thm_window_current_text_bg "#e4c56d"
set -ogq @thm_window_current_text_fg "#151013"
