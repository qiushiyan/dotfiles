# vim:set ft=tmux:
# Raindrop dark — Ray.so (Raycast); source and surface derivation:
# https://github.com/raycast/ray-so/blob/6738b5810b34a00ad58edac30686d43db22db90c/app/(navigation)/(code)/store/themes.ts#L1422-L1466
# bg = 75%-black frame over gradient midpoint; surface_0 = bright endpoint;
# mantle/crust = dark endpoint. surface_1 = cyan at 20% over bg, one step up.
# Inactive badge/name: quiet slate with ice ink. Active badge: keyword cyan
# with mantle ink; active name: white over the cyan selection tint.
# Mint green is the session pill. Violet (diffDeleted) fills red/mauve roles;
# ice blue fills yellow/copy selection because upstream has no warm tokens.
# Crust on ice is >11:1; source comment slate remains 3.82:1 on the base.
set -ogq @thm_bg "#152435"
set -ogq @thm_fg "#E4F2FF"
set -ogq @thm_rosewater "#9DD8EB"
set -ogq @thm_flamingo "#9DD8EB"
set -ogq @thm_pink "#9984EE"
set -ogq @thm_mauve "#9984EE"
set -ogq @thm_red "#9984EE"
set -ogq @thm_maroon "#9984EE"
set -ogq @thm_peach "#9DD8EB"
set -ogq @thm_yellow "#9DD8EB"
set -ogq @thm_green "#1AD6B5"
set -ogq @thm_teal "#1AD6B5"
set -ogq @thm_sky "#2ED9FF"
set -ogq @thm_sapphire "#008BB7"
set -ogq @thm_blue "#8EC7FB"
set -ogq @thm_lavender "#9984EE"
set -ogq @thm_subtext_1 "#9DD8EB"
set -ogq @thm_subtext_0 "#6C808B"
set -ogq @thm_overlay_2 "#2ED9FF"
set -ogq @thm_overlay_1 "#6C808B"
set -ogq @thm_overlay_0 "#455764"
set -ogq @thm_surface_2 "#1A485D"
set -ogq @thm_surface_1 "#1A485D"
set -ogq @thm_surface_0 "#24323F"
set -ogq @thm_mantle "#07152B"
set -ogq @thm_crust "#07152B"
set -ogq @thm_window_number_bg "#24323F"
set -ogq @thm_window_number_fg "#9DD8EB"
