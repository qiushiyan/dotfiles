# vim:set ft=tmux:

# --> Night Owl — deep-navy dark arrangement
#
# Hand-tuned to match Ghostty's built-in "Night Owl" terminal palette (Sarah
# Drasner's theme: bg #011627, fg #d6deeb, the same 16 accents as the Zed
# "Night Owl" theme). There is no vendored night-owl tmux theme, so this mirrors
# the slot layout of the catppuccin plugin's catppuccin_mocha_tmux.conf. Slot
# meanings (via the catppuccin plugin + tmux.conf separators):
#   overlay_2  = inactive window number badge      surface_0 = window name chip,
#   mauve      = current window number badge                   message bg
#   crust      = numeral/icon fg on colored chips  surface_1 = current name chip
#   fg         = text on name chips                bg        = popup bg
# Same vibrant badge design as tokyo_night_moon: inactive windows get a cyan
# number badge (overlay_2); the active window gets a purple badge (mauve) on a
# violet-tinted name chip (surface_1), so it reads as one cohesive purple unit
# against the navy. The plugin fixes the contrast direction — badges are bright
# (dark @thm_crust numerals), chips are dark (light @thm_fg names) — so the two
# are tuned to opposite ends. lavender (active pane border) stays synced to
# mauve; green is the session pill (set in tmux.conf's selector) and is Night
# Owl's signature lime (#addb67, its ANSI-yellow slot) rather than the neon
# terminal green #22da6e, which glares against the navy; yellow is the copy-mode
# selection. surface_1 is the one improvised value (see below).
# Keys mirror plugins/tmux/themes/catppuccin_mocha_tmux.conf; loaded by the
# palette force-load in tmux.conf (which seds -ogq to -g).
set -ogq @thm_bg "#011627"
set -ogq @thm_fg "#d6deeb"

# Colors (Night Owl accents)
set -ogq @thm_rosewater "#c792ea"
set -ogq @thm_flamingo "#c792ea"
set -ogq @thm_pink "#c792ea"
set -ogq @thm_mauve "#c792ea"
set -ogq @thm_red "#ef5350"
set -ogq @thm_maroon "#ef5350"
set -ogq @thm_peach "#f78c6c"
set -ogq @thm_yellow "#ffeb95"
set -ogq @thm_green "#addb67"
set -ogq @thm_teal "#7fdbca"
set -ogq @thm_sky "#21c7a8"
set -ogq @thm_sapphire "#82aaff"
set -ogq @thm_blue "#82aaff"
set -ogq @thm_lavender "#c792ea"

# Surfaces and overlays (night-owl.nvim's palette scale, dark)
set -ogq @thm_subtext_1 "#b2ccd6"
set -ogq @thm_subtext_0 "#7e97ac"
# overlay_2 = inactive window number badge bg. Tuned to Night Owl's bright cyan
# (a real accent token) instead of the grey-blue scale (#5f7e97/#7e97ac) so every
# inactive window carries color — dark @thm_crust numerals read on it.
set -ogq @thm_overlay_2 "#7fdbca"
set -ogq @thm_overlay_1 "#5f7e97"
set -ogq @thm_overlay_0 "#4b6479"
set -ogq @thm_surface_2 "#395a75"
# surface_1 = active window name chip bg. Improvised violet-navy (NOT a literal
# Night Owl token): the theme's own elevated surfaces (#0b2942 tab bg, #1d3b53
# visual) are all the same teal-navy hue as surface_0, so the active window was
# barely distinguishable. This nudges it toward the purple badge (mauve) so the
# active pill reads as a single purple unit; stays dark enough for light
# @thm_fg names.
set -ogq @thm_surface_1 "#2c2a58"
set -ogq @thm_surface_0 "#0b2942"
set -ogq @thm_mantle "#01111d"
# crust stays near-black: numeral fg on the purple/cyan/lime badges, session
# icon fg on the lime chip, and the copy-mode selection fg
set -ogq @thm_crust "#010d18"
