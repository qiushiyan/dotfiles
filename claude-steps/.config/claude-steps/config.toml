# Labels for claude-steps: the columns of the session board (prefix S).
# A label groups skills, TabType snippets and envoy jobs under one name. Its
# cell shows when the latest of them happened in a session; it carries no
# state. Anything no label lists still appears in the session's timeline.
# Format and rules: ~/dev/claude-steps/README.md.
#
# The labels stand in the order a pull request goes through them, so a row of
# the board reads left to right. Each names its hue: taken by place, the hues
# would move whenever a label is added.

# The files a pasted snippet is recognised from: the global one, and each
# project's own beside it. A file a machine lacks holds none. Naming a file
# makes a paste from it a `pasted <key>` line, which is a step only under a
# label that lists the key, so list a project's keys below when adding its
# file. A list needs the binary that reads one: an older one refuses it.
snippets = [
  "~/.config/tabtype/config.toml",
  "~/dev/planlab/main/.tabtype.local.toml",
  "~/dev/tabtype/.tabtype.local.toml",
]

[[label]]
name = "consult"
skills = ["consult"]
snippets = ["consult-codex", "consult-then-build"]
jobs = ["consult-"]
color = "blue"

[[label]]
name = "spec"
skills = ["write-spec"]
snippets = ["implement-spec"]
color = "green"

# loopy-review-verify asks for the review and the verification in one paste,
# so it stands under both; review-then-closeout likewise, under closeout.
[[label]]
name = "review"
skills = ["review"]
snippets = ["review-verify", "loopy-review-verify", "review-then-closeout"]
jobs = ["review-"]
count_commits = true
color = "magenta"

[[label]]
name = "verify"
skills = ["pl-loopy-verify"]
snippets = ["loopy-review-verify"]
count_commits = true
color = "cyan"

# Handoffs sit here because writing one is a docs pass, and distilling them
# after the merge is another.
[[label]]
name = "docs"
skills = ["update-docs", "pl-loopy-update-docs", "handoff", "pl-loopy-handoff", "pl-loopy-infra-handoff", "pl-loopy-handoff-distill"]
count_commits = true
color = "green"

# The reviewers on the pull request itself, bots and people. `review` is the
# cold round this session dispatches.
[[label]]
name = "pr-review"
skills = ["pl-handle-code-review"]
count_commits = true
color = "cyan"

[[label]]
name = "prompts"
skills = ["prompt-engineering"]
snippets = ["prompt-check", "loopy-prompt-check"]
color = "blue"

# The merge, the install on both machines and the branch's removal, for a
# tool that merges locally. The closeout snippet's docs pass shows under docs.
[[label]]
name = "closeout"
snippets = ["closeout", "review-then-closeout"]
color = "magenta"
