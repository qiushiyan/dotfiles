trigger = ";;"
providers = [
  "recent",
  "files",
  "app",
  "manual",
  "skills",
  "git",
  "docs",
  "scripts",
]

# ── Reasoning helpers ──────────────────────────────────
[[snippets]]
key = "think-holistic"
expand = '''
This is an analysis pass: the deliverable is a direction I can approve, grounded in the code as it is today, and the code stays unchanged until I do. Lead your write-up with the problem as you now state it and the direction you recommend, then the decisions you need from me; the reading behind them and any parked technical questions follow. It is one write-up: your questions travel in it with your recommendations, and the analysis proceeds on those rather than waiting for my answers.

1. **Read the relevant code** to see how things work today. Trace real data/control flow, note existing constraints and why they exist, cite the files/functions you read. Without this, "first principles" is guessing.
2. **Ask me about ambiguous product intent** (fuzzy terms, unclear scope, priorities you're guessing at) and **push back if my framing seems off**, routing every question per **How to ask questions** below. What the code can answer, the code answers. For a clear, targeted bug fix, skip this step.
3. **State the real problem** and the underlying goal in your own words, informed by what you read.
4. **Evaluate the current design** against the goal — is this a *local* change the structure absorbs cleanly, or is the structure itself in the way? When the structure genuinely blocks the goal, reach for **preparatory refactoring** (Kent Beck: *make the change easy, then make the easy change*): reshape the foundation first so the feature becomes a natural addition, back the "structurally wrong" claim with code, and name its cost. A flawed design gets that structural fix rather than another patch on top; a structure that merely looks imperfect stays as it is.
5. **Explore the design space, then synthesize.** Sketch 2–3 approaches that differ in kind — a different seam, owner, or data shape, anywhere from a change the current structure absorbs to a rework of it — so they stress-test each other instead of standing in as strawmen for a choice you've already made; one idea at a different size or in a different order is still one approach. Then recommend a direction built *from* that comparison, weighed by how fully it solves the root problem rather than how little it disturbs: combine the best of more than one where it helps, rather than adopt a single option whole. Name the tradeoff you're accepting, and where the decision is genuinely a judgment call, say so.
6. **Account for the risk the recommendation carries.** Risk here isn't lines changed — an internal refactor can be large and inert. It's whether the change lands on the **hot path** (code that runs on every request, render, or token), on a **surface the user sees or drives often**, or inside a **core feature's execution logic**. For each of those it touches, say what runs differently, what holds the risk down (coverage that already exists, a flag or fallback, a signal that would catch a regression), and — where the risk is real — why it's worth taking. Ground it in the code you read: "adds a branch that only runs in the error path" is an answer, "overhead is minimal" is not. This is an accounting, not a veto — a controlled risk on the hot path is fine, an unexamined one isn't. When the change touches none of the three, one line saying so is the whole step.

## How to ask questions

Route every question you're tempted to ask into one of three lanes:

- **Product/direction forks** — real decisions with live options that are mine (intent, priorities, UX, scope). Ask these, in the form below. If there are none, say so and move on.
- **Implementation details** — yours. Decide, record the choice in your analysis, continue.
- **Technical unknowns that don't change the direction** — record these under **"Open technical questions — parked for the consult round"**, each with your working answer. I read this list without answering it; a later consultation or review round resolves it. Omit the list when it's empty.

Write each fork as if briefing a CEO: I decide from your words alone, not from the code or the session behind them. Each question carries why it matters now, what it means in plain product terms, the options with what each implies for the real user, and your recommendation. Batch them, clustered by topic — defer only a follow-up that a pending answer would decide or reshape.

<example>
**Q2 — When a schedule import partially fails, do we save the good rows or reject the file?** This decides what a user sees after uploading a 500-task file with 3 bad rows. Save-partial gets them working immediately but they may not notice the 3 missing tasks; reject-whole is safe but turns one typo into a blocked afternoon. Recommendation: save-partial with a banner naming the failed rows — the blocked afternoon is the worse failure.
</example>'''

[[snippets]]
key = "elaborate-questions"
expand = '''
Re-present the questions you just asked so I can decide them from your words alone — I haven't read the code or the session behind them.

For each, as if briefing a CEO: why it matters now, what it actually means in plain product terms, the options with what each implies for the real user, and your recommended answer. Where a question is a technical unknown that doesn't change the direction rather than a decision that's mine, move it under "Open technical questions — parked for the consult round" with your working answer instead of asking it.'''

# ── Consult and verify ─────────────────────────────────
[[snippets]]
key = "consult-codex"
expand = '''
Now run consult with codex — I agree with the general direction; settle the high-level design and the implementation tenets. For important decisions you can ask them as open ended questions with my preference. $0'''

[[snippets]]
key = "consult-then-build"
expand = '''
/consult codex, one round — settle the design, then build without waiting for me. Put the technical unknowns and the questions I left unanswered on trial in the round, each with the default you would take. Stop only for what a sensible default cannot settle: a disagreement with the voice you could not resolve, a problem it replaced or found unsupported, or a new fork that would be expensive to undo. Otherwise take the converged position, implement end to end, committing at major milestones, and say in the final report which defaults you took. $0'''

[[snippets]]
key = "spike-check"
expand = '''
Before we commit to this approach, settle what it rests on with throwaway spikes: read ~/dotfiles/claude/.claude/skills/spike/SKILL.md and treat this as its design moment, for each assumption the approach would fail without rather than only the costliest one. Report the verdicts and what they change in the approach; the build starts after I've read them.'''

# ── Implementation ─────────────────────────────────────
[[snippets]]
key = "implement-spec"
expand = '''
Reread the settled spec to rebuild your mental model on the goals and implementation tenets, then implement end to end, commit at major milestones along the way.'''

[[snippets]]
key = "implement-now"
expand = '''
Decisions are settled as above; where I left one open, take your recommendation. Implement end to end from what we settled, committing at major milestones. Stop and flag it if a settled decision turns out wrong once you're in the code.'''

# ── Review ─────────────────────────────────────────────
[[snippets]]
key = "review-verify"
expand = '''
/review codex full review. While you are waiting, re-prove the intended behavior with throwaway spikes — read ~/dotfiles/claude/.claude/skills/spike/SKILL.md and treat this as its verification moment. Report its verdicts with the review's findings.'''

[[snippets]]
key = "prompt-check"
expand = '''
Review and revise the model-facing surfaces this session touched — prompts, skill bodies, CLAUDE.md, snippets, tool descriptions, results and errors — against ~/dotfiles/claude/.claude/skills/prompt-engineering/SKILL.md, running its revision pass.

Prefer short, clear instructions that invite reasoning, with an informative code example as the pattern, over long prose repeating what the code already says. A structural rewrite is sometimes more effective than patching. Report each finding as a named defect with its fix, and each deliberate keep with its reason; say plainly if nothing needs changing. Do not add literal tests for these surfaces.'''

# ── Closeout ───────────────────────────────────────────
# Both carry the same numbered closeout: an edit to one is an edit to the other.
# ~/dev/tabtype/.tabtype.local.toml replaces both keys there, with a release as
# the install.
[[snippets]]
key = "closeout"
expand = '''
/update-docs for the work this branch finished, then close the branch out: main pushed, the new build installed on both machines, the feature branch gone. This is one of my own tools, so it merges locally with no PR.

1. **Docs.** Your plan's gated items are approved in advance where the project's doc bindings allow them, except settling a doc/code disagreement by changing the described design: leave that one alone and name it in the report. Commit the docs.
2. **Merge.** In the main checkout, bring main level with origin, merge the branch, and run the project's checks on the result before pushing, because the push is what both machines build from. Resolve a conflict with the resolving-merge-conflicts skill and say what it traded off; stop with the merge unpushed if a check fails. Then push main.
3. **Install.** Run `twin sync` naming this repo as its target (bare, it syncs the repository the shell stands in, or every repository from outside one) and report its closing status block. An info line there about this branch is cleared by step 4.
4. **Remove the branch.** Run `gwt remove` on the feature branch from the main checkout, since it refuses the worktree it is run from; it takes the worktree with it. Any other refusal means keep the branch and say why.

Work already on main skips the merge in step 2 and all of step 4, and its docs pass covers this session's commits. $0'''

[[snippets]]
key = "review-then-closeout"
expand = '''
/review codex full review, then close the branch out if the round leaves nothing for me to decide: docs updated, main pushed, the new build installed on both machines, the feature branch gone. This is one of my own tools, so it merges locally with no PR.

Fix what you confirm as the skill says, minors included, and run its second round first when the fixes were substantive. Its ideas wait for me in the report and don't stop the closeout. The closeout runs only if the skill's report would open by saying nothing needs me: a finding you judge foundational stops you at that report, and so does an objection to the design that you rebutted, which I should hear before a merge settles it. With nothing for me, continue:

1. **Docs.** Run the update-docs skill for the work this branch finished, the review's fixes included. Its plan's gated items are approved in advance where the project's doc bindings allow them, except settling a doc/code disagreement by changing the described design: leave that one alone and name it in the report. Commit the docs.
2. **Merge.** In the main checkout, bring main level with origin, merge the branch, and run the project's checks on the result before pushing, because the push is what both machines build from. Resolve a conflict with the resolving-merge-conflicts skill and say what it traded off; stop with the merge unpushed if a check fails. Then push main.
3. **Install.** Run `twin sync` naming this repo as its target (bare, it syncs the repository the shell stands in, or every repository from outside one) and report its closing status block. An info line there about this branch is cleared by step 4.
4. **Remove the branch.** Run `gwt remove` on the feature branch from the main checkout, since it refuses the worktree it is run from; it takes the worktree with it. Any other refusal means keep the branch and say why.

Work already on main skips the merge in step 2 and all of step 4, and its docs pass covers this session's commits. $0'''

[settings]
scan_depth = 5
material = "glass"
appearance = "light"
case_sensitive = false
max_branch_age_days = 90
badge_palette = "minimal"
ignore_patterns = ["node_modules", ".git", "dist", "build"]


