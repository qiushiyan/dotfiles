trigger = ";;"
providers = [
  "recent",
  "files",
  "app",
  "manual",
  "skills",
  "git",
  "docs",
  "scripts",
]

# ── Reasoning helpers ──────────────────────────────────
[[snippets]]
key = "think-holistic"
expand = '''
**Don't change code yet — this is an analysis pass.** Reason holistically, grounded in actual code, not assumptions.

1. **Read the relevant code** to see how things work today. Trace real data/control flow, note existing constraints and why they exist, cite the files/functions you read. Without this, "first principles" is guessing.
2. **Interview me about ambiguous product intent** (fuzzy terms, unclear scope, priorities you're guessing at) and **push back if my framing seems off**. Route and write every question per **How to ask questions** below. Don't ask what code can answer — you've just read it. **For clear, targeted bug fixes, skip this step.**
3. **State the real problem** and the underlying goal **in your own words**, informed by what you read and learned.
4. **Evaluate the current design** against the goal — is this a *local* change the structure absorbs cleanly, or is the structure itself in the way? When the foundation fights the change, reach for **preparatory refactoring** (Kent Beck: *make the change easy, then make the easy change*) — reshape the foundation first so the feature becomes a natural addition.
5. **Explore the design space, then synthesize.** Sketch 2–3 approaches that make *genuinely different bets* — from a contained change within the subsystem's current structure to a rework of its architecture — so they stress-test each other instead of standing in as strawmen for a choice you've already made. Then recommend a direction built *from* that comparison, weighed by how fully it solves the root problem rather than how little it disturbs: combine the best of more than one where it helps, rather than adopt a single option whole. Name the tradeoff you're accepting, and where the decision is genuinely a judgment call, say so.
6. **Account for the risk the recommendation carries.** Risk here isn't lines changed — an internal refactor can be large and inert. It's whether the change lands on the **hot path** (code that runs on every request, render, or token), on a **surface the user sees or drives often**, or inside a **core feature's execution logic**. For each of those it touches, say what runs differently, what holds the risk down (coverage that already exists, a flag or fallback, a signal that would catch a regression), and — where the risk is real — why it's worth taking. Ground it in the code you read: "adds a branch that only runs in the error path" is an answer, "overhead is minimal" is not. This is an accounting, not a veto — a controlled risk on the hot path is fine, an unexamined one isn't. When the change touches none of the three, one line saying so is the whole step.

Don't patch a flawed design with another patch, and don't shy from structural change when it's justified — but back a "structurally wrong" claim with code and name its cost. Preparatory refactoring is earned only when the structure genuinely blocks the goal, never license to rewrite what merely looks imperfect.

## How to ask questions

Route every question you're tempted to ask into one of three lanes:

- **Product/direction forks** — real decisions with live options that are mine (intent, priorities, UX, scope). Ask these, in the form below. If there are none, say so and move on.
- **Implementation details** — yours. Decide, record the choice in your analysis, continue.
- **Technical unknowns that don't change the direction** — record these under **"Open technical questions — parked for the consult round"**, each with your working answer. I read this list without answering it; a later consultation or review round resolves it. Omit the list when it's empty.

Write each fork as if briefing a CEO: I decide from your words alone, not from the code or the session behind them. Each question carries why it matters now, what it means in plain product terms, the options with what each implies for the real user, and your recommendation. Batch them, clustered by topic — defer only a follow-up that a pending answer would decide or reshape. Before sending, check each against: could I decide from this text alone?

<example>
**Q2 — When a schedule import partially fails, do we save the good rows or reject the file?** This decides what a user sees after uploading a 500-task file with 3 bad rows. Save-partial gets them working immediately but they may not notice the 3 missing tasks; reject-whole is safe but turns one typo into a blocked afternoon. Recommendation: save-partial with a banner naming the failed rows — the blocked afternoon is the worse failure.
</example>'''

[[snippets]]
key = "elaborate-questions"
expand = '''
Re-present the questions you just asked so I can decide them from your words alone — I haven't read the code or the session behind them.

For each, as if briefing a CEO: why it matters now, what it actually means in plain product terms, the options with what each implies for the real user, and your recommended answer. Where a question is a technical unknown that doesn't change the direction rather than a decision that's mine, move it under "Open technical questions — parked for the consult round" with your working answer instead of asking it.'''

# ── Consult and verify ─────────────────────────────────
[[snippets]]
key = "consult-codex"
expand = '''
/consult codex — I agree with the general direction; settle the high-level design and the implementation tenets. $0'''

[[snippets]]
key = "consult-then-build"
expand = '''
/consult codex — settle the design, then build. Put to the voice the technical unknowns and the questions you asked me that I left unanswered, as open questions each with your recommended default. After the synthesis, if nothing major needs my decision (a product or direction fork, or a disagreement with the voice that changes the shape), implement end to end from the converged position, committing at major milestones. Otherwise stop and bring me that decision. $0'''

[[snippets]]
key = "spike-check"
expand = '''
Before we commit to this, prove the load-bearing pieces with throwaway spikes — read ~/dotfiles/claude/.claude/skills/spike/SKILL.md for the discipline. One spike per claim; report expected vs. actual. Verify only, no implementation yet.'''

# ── Implementation ─────────────────────────────────────
[[snippets]]
key = "implement-spec"
expand = '''
Reread the settled spec to rebuild your mental model on the goals and implementation tenets, then implement end to end, commit at major milestones along the way.'''

[[snippets]]
key = "implement-now"
expand = '''
Decisions are settled as above; where I left one open, take your recommendation. Implement end to end from what we settled, committing at major milestones. Stop and flag it if a settled decision turns out wrong once you're in the code.'''

# ── Review ─────────────────────────────────────────────
[[snippets]]
key = "review-verify"
expand = '''
/review codex full review. While you are waiting, re-prove the intended behavior with throwaway spikes — read ~/dotfiles/claude/.claude/skills/spike/SKILL.md for the discipline (the real thing under test, a thin harness, a verdict carried by the run's output); this is its around-a-change moment, one spike per claimed behavior. Report expected vs. actual.'''

[[snippets]]
key = "prompt-check"
expand = '''
Review and revise the model-facing surfaces this session touched — prompts, skill bodies, CLAUDE.md, snippets, tool descriptions, results and errors — against ~/dotfiles/claude/.claude/skills/prompt-engineering/SKILL.md, running its revision pass.

Prefer short, clear instructions that invite reasoning, with an informative code example as the pattern, over long prose repeating what the code already says. A structural rewrite is sometimes more effective than patching. Report each finding as a named defect with its fix, and each deliberate keep with its reason; say plainly if nothing needs changing. Do not add literal tests for these surfaces.'''

[settings]
scan_depth = 5
material = "glass"
appearance = "light"
case_sensitive = false
max_branch_age_days = 90
badge_palette = "minimal"
ignore_patterns = ["node_modules", ".git", "dist", "build"]


