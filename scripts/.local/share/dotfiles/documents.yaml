# Documents skill-sync copies verbatim from this repository into other checkouts.
# `source` is relative to the dotfiles root; `repo` is a checkout root (its
# `.git` may be a directory or a worktree file); `path` is relative to that root.
# An absent checkout is skipped with a notice; a present one is kept in sync.
documents:
  - source: docs/documentation-standards.md
    destinations:
      - repo: ~/dev/planlab/main
        path: docs/loopy/documentation-standards.md
      - repo: ~/dev/itell
        path: apps/platform/docs/documentation-standards.md
      - repo: ~/dev/tabtype
        path: docs/documentation-standards.md
      - repo: ~/dev/brief
        path: docs/documentation-standards.md
      - repo: ~/dev/envoy
        path: docs/documentation-standards.md

  # The prompt rulebook, so planlab's teammates, Codex and CI read the rules
  # its Loopy guide (docs/loopy/prompting-guide.md) builds on. A personal
  # skill outranks a project one of the same name, so this machine keeps
  # reading the originals here. Planlab keeps its own agents/openai.yaml,
  # since its layout check rejects the managed comment in ours.
  - source: claude/.claude/skills/prompt-engineering/SKILL.md
    destinations:
      - repo: ~/dev/planlab/main
        path: .agents/skills/prompt-engineering/SKILL.md
  - source: claude/.claude/skills/prompt-engineering/TOOLS.md
    destinations:
