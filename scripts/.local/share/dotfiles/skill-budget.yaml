# Size records for the skills this repository owns: those neither in the
# Skills CLI lock nor linked from another project. The prompt-engineering
# rulebook's "Write short" says why; skill-sync enforces them.
body_words: 1500  # a new skill's SKILL.md body must fit this to be recorded
description_words:
  model: 30   # model-invoked: in context every turn
  manual: 10  # disable-model-invocation or user-invocable-only: a menu label
# Every owned skill at its size: body is SKILL.md after the frontmatter, total
# adds the Markdown files beside it except EVIDENCE.md and LESSONS.md.
# skill-sync lowers a record as its skill shrinks and never raises one, so
# growth fails the check: an addition replaces something, or the record is
# raised here by hand with a comment saying why.
